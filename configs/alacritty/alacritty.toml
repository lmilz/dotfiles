[window]
decorations = "full"
opacity = 0.92
dynamic_padding = false

[general]
live_config_reload = true

[window.padding]
x = 12
y = 10

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[colors.primary]
background = "#0b0c0f"
foreground = "#d6d6d6"

[colors.normal]
black   = "#121212"
red     = "#ff5370"
green   = "#2de0a7"
yellow  = "#ffcb6b"
blue    = "#82aaff"
magenta = "#c792ea"
cyan    = "#89ddff"
white   = "#d0d0d0"

[colors.bright]
black   = "#1e1e1e"
red     = "#ff757f"
green   = "#5af8c1"
yellow  = "#ffe585"
blue    = "#9cc4ff"
magenta = "#d9a7ff"
cyan    = "#a8eaff"
white   = "#ffffff"

[cursor]
style = "Beam"
unfocused_hollow = true

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true

